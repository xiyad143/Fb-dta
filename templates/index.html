<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMedia Pro – Facebook Auto Publisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar-link.active { background: #e7f3ff; color: #1877f2; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .video-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .drag-over { border: 2px dashed #1877f2; background: #e7f3ff; }
    </style>
</head>
<body class="font-sans">

<div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-white shadow-md flex flex-col">
        <div class="p-4 border-b">
            <h1 class="text-xl font-bold text-blue-600">XMedia Pro</h1>
        </div>
        <nav class="flex-1 p-3 space-y-1">
            <a href="#" data-section="dashboard" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-tachometer-alt w-5"></i> Dashboard</a>
            <a href="#" data-section="pages" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-th-large w-5"></i> Pages</a>
            <a href="#" data-section="library" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-film w-5"></i> Upload Library</a>
            <a href="#" data-section="scheduler" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-clock w-5"></i> Scheduler</a>
            <a href="#" data-section="posts" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-newspaper w-5"></i> Posts</a>
            <a href="#" data-section="analytics" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-chart-line w-5"></i> Analytics</a>
            <a href="#" data-section="settings" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100"><i class="fas fa-cog w-5"></i> Settings</a>
        </nav>
        <div class="p-4 border-t text-xs text-gray-500">
            <div id="user-info"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto p-6">
        <!-- Dashboard -->
        <div id="dashboard-section" class="section">
            <div class="mb-6"><h2 class="text-2xl font-semibold">Dashboard</h2></div>
            <div id="user-card" class="bg-white p-4 rounded-xl shadow mb-6 flex items-center gap-4"></div>
            <div id="page-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
            <div class="bg-white rounded-xl shadow p-5 mb-8">
                <h3 class="text-lg font-semibold mb-3">⚡ Quick Upload</h3>
                <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer">
                    <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                    <p>Drag & drop video or click to upload</p>
                    <input type="file" id="file-input" accept="video/*" class="hidden">
                </div>
                <div class="mt-3 flex gap-3">
                    <select id="quick-page" class="border rounded p-2 flex-1"></select>
                    <input id="quick-caption" placeholder="Caption (optional)" class="border rounded p-2 flex-1">
                    <button id="quick-upload-btn" class="bg-blue-600 text-white px-4 rounded hover:bg-blue-700">Upload to Library</button>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow p-5">
                <h3 class="text-lg font-semibold mb-3">⏰ Upcoming Schedule</h3>
                <div id="upcoming-preview" class="space-y-2"></div>
            </div>
        </div>

        <!-- Pages -->
        <div id="pages-section" class="section hidden">
            <h2 class="text-2xl font-semibold mb-4">📄 Your Pages</h2>
            <button id="refresh-pages-btn" class="bg-blue-600 text-white px-4 py-2 rounded mb-4">Refresh Pages</button>
            <div id="pages-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- Library -->
        <div id="library-section" class="section hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold">🎬 Media Library</h2>
                <button id="upload-library-btn" class="bg-blue-600 text-white px-4 py-2 rounded"><i class="fas fa-plus"></i> Upload Video</button>
            </div>
            <div id="media-grid" class="video-grid"></div>
        </div>

        <!-- Scheduler -->
        <div id="scheduler-section" class="section hidden">
            <h2 class="text-2xl font-semibold mb-4">⏰ Schedule New Post</h2>
            <div class="bg-white rounded-xl shadow p-5 mb-6">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium">Select Page</label>
                        <select id="schedule-page" class="w-full border rounded p-2"></select>
                    </div>
                    <div>
                        <label class="block font-medium">Select Video</label>
                        <select id="schedule-video" class="w-full border rounded p-2"></select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-medium">Caption</label>
                        <textarea id="schedule-caption" rows="2" class="w-full border rounded p-2"></textarea>
                        <button id="ai-caption-btn" class="text-blue-600 text-sm mt-1"><i class="fas fa-magic"></i> Generate AI Caption</button>
                    </div>
                    <div>
                        <label class="block font-medium">Date & Time</label>
                        <input type="datetime-local" id="schedule-datetime" class="w-full border rounded p-2">
                    </div>
                </div>
                <button id="schedule-submit" class="mt-4 bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Schedule Post</button>
            </div>
            <h3 class="text-xl font-semibold mb-2">Scheduled Posts</h3>
            <div id="scheduled-list" class="bg-white rounded-xl shadow overflow-x-auto"></div>
        </div>

        <!-- Posts -->
        <div id="posts-section" class="section hidden">
            <h2 class="text-2xl font-semibold mb-4">📢 All Posts</h2>
            <div class="flex gap-2 mb-4">
                <button class="filter-posts-btn active bg-blue-600 text-white px-3 py-1 rounded" data-status="all">All</button>
                <button class="filter-posts-btn bg-gray-200 px-3 py-1 rounded" data-status="pending">Pending</button>
                <button class="filter-posts-btn bg-gray-200 px-3 py-1 rounded" data-status="published">Published</button>
                <button class="filter-posts-btn bg-gray-200 px-3 py-1 rounded" data-status="failed">Failed</button>
            </div>
            <div id="posts-list" class="bg-white rounded-xl shadow divide-y"></div>
        </div>

        <!-- Analytics -->
        <div id="analytics-section" class="section hidden">
            <h2 class="text-2xl font-semibold mb-4">📊 Analytics</h2>
            <div class="mb-4">
                <label>Select Page:</label>
                <select id="analytics-page" class="border rounded p-2 ml-2"></select>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-white p-4 rounded-xl shadow"><canvas id="followers-chart"></canvas></div>
                <div class="bg-white p-4 rounded-xl shadow"><canvas id="reach-chart"></canvas></div>
                <div class="bg-white p-4 rounded-xl shadow col-span-2"><canvas id="engagement-chart"></canvas></div>
            </div>
        </div>

        <!-- Settings -->
        <div id="settings-section" class="section hidden">
            <h2 class="text-2xl font-semibold mb-4">⚙️ Settings</h2>
            <div class="bg-white rounded-xl shadow p-6 space-y-4">
                <div>
                    <label class="block font-medium">Facebook App ID</label>
                    <input type="text" id="fb-app-id" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block font-medium">Facebook App Secret</label>
                    <input type="password" id="fb-app-secret" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block font-medium">Groq API Key (AI Caption)</label>
                    <input type="password" id="groq-key" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block font-medium">Telegram Bot Token</label>
                    <input type="text" id="telegram-token" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block font-medium">Telegram Chat ID</label>
                    <input type="text" id="telegram-chat" class="w-full border rounded p-2">
                </div>
                <button id="save-settings" class="bg-blue-600 text-white px-4 py-2 rounded">Save Settings</button>
                <hr>
                <div>
                    <h3 class="font-semibold">Facebook Connection</h3>
                    <button id="connect-fb-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Connect Facebook</button>
                    <button id="disconnect-fb-btn" class="bg-red-600 text-white px-4 py-2 rounded ml-2">Disconnect</button>
                    <p id="fb-connection-status" class="mt-2 text-sm"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- Global State ----------
    let currentUser = null;
    let pages = [];
    let mediaList = [];
    let scheduledPosts = [];
    let analyticsCharts = {};

    async function apiCall(url, options = {}) {
        const res = await fetch(url, options);
        return res.json();
    }

    async function loadUser() {
        const data = await apiCall('/api/user-profile').catch(() => ({ error: 'Not connected' }));
        if (data.error) {
            document.getElementById('user-card').innerHTML = `<div class="text-red-500">${data.error} – please connect Facebook in Settings</div>`;
            return;
        }
        currentUser = data;
        document.getElementById('user-card').innerHTML = `
            <img src="${data.picture?.data?.url}" class="w-12 h-12 rounded-full">
            <div><strong>${data.name}</strong><br>Facebook Connected</div>
        `;
        document.getElementById('user-info').innerHTML = `<i class="fab fa-facebook"></i> ${data.name}`;
        await loadPages();
        await loadMedia();
        await loadScheduled();
        renderDashboard();
    }

    async function loadPages() {
        const res = await apiCall('/api/pages');
        pages = res.error ? [] : res;
        renderPageCards();
        syncPageSelectors();
    }

    function syncPageSelectors() {
        ['quick-page', 'schedule-page', 'analytics-page'].forEach(id => {
            const sel = document.getElementById(id);
            if (sel) {
                sel.innerHTML = pages.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
                if (pages.length) sel.value = pages[0].id;
            }
        });
    }

    async function loadMedia() {
        const res = await apiCall('/api/media');
        mediaList = res;
        renderMediaLibrary();
        syncVideoSelect();
    }

    function syncVideoSelect() {
        const sel = document.getElementById('schedule-video');
        if (sel) sel.innerHTML = mediaList.map(m => `<option value="${m.id}">${m.original_name}</option>`).join('');
    }

    async function loadScheduled() {
        const res = await apiCall('/api/scheduled-posts');
        scheduledPosts = res;
        renderScheduledList();
        renderUpcomingPreview();
        renderPostsList('all');
    }

    function renderPageCards() {
        const container = document.getElementById('page-cards');
        if (!container) return;
        container.innerHTML = pages.map(p => `
            <div class="bg-white rounded-xl shadow p-4 flex items-center gap-3">
                <img src="${p.picture_url || 'https://via.placeholder.com/50'}" class="w-12 h-12 rounded-full">
                <div class="flex-1">
                    <h3 class="font-semibold">${p.name}</h3>
                    <p class="text-sm text-gray-500">Followers: ${p.fan_count || 0}</p>
                </div>
                <button class="select-page-btn bg-blue-100 text-blue-600 px-3 py-1 rounded" data-id="${p.id}">Select</button>
            </div>
        `).join('');
        document.querySelectorAll('.select-page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('schedule-page').value = btn.dataset.id;
                document.querySelector('[data-section="scheduler"]').click();
            });
        });
    }

    function renderUpcomingPreview() {
        const container = document.getElementById('upcoming-preview');
        const upcoming = scheduledPosts.filter(p => p.status === 'pending').slice(0, 5);
        container.innerHTML = upcoming.map(p => `
            <div class="flex justify-between p-2 border-b">
                <span><strong>${p.media_filename || 'Video'}</strong> → ${p.page_id}</span>
                <span>${new Date(p.scheduled_time).toLocaleString()}</span>
                <span class="text-yellow-600">Pending</span>
            </div>
        `).join('');
        if (!upcoming.length) container.innerHTML = '<p class="text-gray-500">No upcoming posts</p>';
    }

    // ---------- Media Library ----------
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    if (dropzone) {
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
        dropzone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) await uploadFile(file);
        });
        fileInput.addEventListener('change', async () => {
            if (fileInput.files[0]) await uploadFile(fileInput.files[0]);
        });
    }
    async function uploadFile(file) {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch('/api/upload-media', { method: 'POST', body: formData });
        if (res.ok) {
            await loadMedia();
            alert('Uploaded to library');
        } else alert('Upload failed');
    }
    document.getElementById('quick-upload-btn')?.addEventListener('click', async () => {
        const pageId = document.getElementById('quick-page').value;
        const caption = document.getElementById('quick-caption').value;
        const mediaId = document.getElementById('schedule-video')?.value;
        if (!mediaId) return alert('No video selected');
        const res = await apiCall('/api/publish-now', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page_id: pageId, media_id: parseInt(mediaId), caption })
        });
        if (res.success) alert('Published instantly!');
        else alert('Error: ' + res.error);
    });

    function renderMediaLibrary() {
        const container = document.getElementById('media-grid');
        if (!container) return;
        container.innerHTML = mediaList.map(m => `
            <div class="video-card">
                <video src="${m.url}" class="w-full h-32 object-cover"></video>
                <div class="p-2">
                    <p class="text-sm truncate">${m.original_name}</p>
                    <div class="flex justify-between mt-2">
                        <button class="assign-media text-blue-600 text-xs" data-id="${m.id}" data-name="${m.original_name}"><i class="fas fa-folder"></i> Assign</button>
                        <button class="delete-media text-red-600 text-xs" data-id="${m.id}"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.delete-media').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm('Delete video?')) {
                    await fetch(`/api/media/${btn.dataset.id}`, { method: 'DELETE' });
                    await loadMedia();
                }
            });
        });
        document.querySelectorAll('.assign-media').forEach(btn => {
            btn.addEventListener('click', async () => {
                const newPage = prompt('Enter Page ID to assign this video (leave blank to unassign)');
                const pageId = newPage || null;
                await fetch(`/api/media/${btn.dataset.id}/assign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_id: pageId })
                });
                await loadMedia();
            });
        });
    }

    // ---------- Scheduler ----------
    document.getElementById('schedule-submit')?.addEventListener('click', async () => {
        const pageId = document.getElementById('schedule-page').value;
        const mediaId = document.getElementById('schedule-video').value;
        const caption = document.getElementById('schedule-caption').value;
        const datetime = document.getElementById('schedule-datetime').value;
        if (!pageId || !mediaId || !datetime) return alert('Fill all fields');
        const res = await apiCall('/api/schedule', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page_id: pageId, media_id: parseInt(mediaId), caption, scheduled_time: datetime })
        });
        if (res.success) {
            alert('Scheduled!');
            await loadScheduled();
        } else alert(res.error);
    });

    document.getElementById('ai-caption-btn')?.addEventListener('click', async () => {
        const prompt = prompt('Describe your video content:');
        if (prompt) {
            const res = await apiCall('/api/ai-caption', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
            if (res.caption) document.getElementById('schedule-caption').value = res.caption;
            else alert(res.error);
        }
    });

    function renderScheduledList() {
        const container = document.getElementById('scheduled-list');
        if (!container) return;
        container.innerHTML = `
            <table class="min-w-full">
                <thead class="bg-gray-100"><tr><th class="p-2">Video</th><th>Page</th><th>Time</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                    ${scheduledPosts.map(p => `
                        <tr class="border-t">
                            <td class="p-2">${p.media_filename || 'Video'}</td>
                            <td>${p.page_id}</td>
                            <td>${new Date(p.scheduled_time).toLocaleString()}</td>
                            <td><span class="px-2 py-1 rounded text-xs ${p.status === 'pending' ? 'bg-yellow-100' : p.status === 'published' ? 'bg-green-100' : 'bg-red-100'}">${p.status}</span></td>
                            <td><button class="delete-sched text-red-600" data-id="${p.id}">Delete</button></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        document.querySelectorAll('.delete-sched').forEach(btn => {
            btn.addEventListener('click', async () => {
                await fetch(`/api/scheduled-posts/${btn.dataset.id}`, { method: 'DELETE' });
                await loadScheduled();
            });
        });
    }

    function renderPostsList(filter) {
        const container = document.getElementById('posts-list');
        let filtered = scheduledPosts;
        if (filter !== 'all') filtered = scheduledPosts.filter(p => p.status === filter);
        container.innerHTML = filtered.map(p => `
            <div class="p-3 flex justify-between items-center">
                <div><strong>${p.media_filename}</strong><br><span class="text-sm">${p.page_id} · ${new Date(p.scheduled_time).toLocaleString()}</span><br><span class="text-xs text-gray-500">${p.caption?.substring(0, 60)}</span></div>
                <div>
                    <span class="status-badge px-2 py-1 rounded text-xs ${p.status === 'pending' ? 'bg-yellow-100' : p.status === 'published' ? 'bg-green-100' : 'bg-red-100'}">${p.status}</span>
                    ${p.status === 'pending' ? `<button class="delete-post ml-2 text-red-600" data-id="${p.id}">Cancel</button>` : ''}
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.delete-post').forEach(btn => {
            btn.addEventListener('click', async () => {
                await fetch(`/api/scheduled-posts/${btn.dataset.id}`, { method: 'DELETE' });
                await loadScheduled();
            });
        });
    }

    // ---------- Analytics ----------
    async function loadAnalytics(pageId) {
        const res = await apiCall(`/api/analytics/${pageId}`);
        if (res.error) return alert(res.error);
        const dates = (res.page_fans || []).map(d => d.date);
        const follows = (res.page_fans || []).map(d => d.value);
        const reach = (res.page_impressions || []).map(d => d.value);
        const engagement = (res.page_engaged_users || []).map(d => d.value);
        if (analyticsCharts.followers) analyticsCharts.followers.destroy();
        if (analyticsCharts.reach) analyticsCharts.reach.destroy();
        if (analyticsCharts.engagement) analyticsCharts.engagement.destroy();
        analyticsCharts.followers = new Chart(document.getElementById('followers-chart'), { type: 'line', data: { labels: dates, datasets: [{ label: 'Followers', data: follows, borderColor: 'blue' }] } });
        analyticsCharts.reach = new Chart(document.getElementById('reach-chart'), { type: 'line', data: { labels: dates, datasets: [{ label: 'Reach', data: reach, borderColor: 'green' }] } });
        analyticsCharts.engagement = new Chart(document.getElementById('engagement-chart'), { type: 'bar', data: { labels: dates, datasets: [{ label: 'Engaged Users', data: engagement, backgroundColor: 'orange' }] } });
    }

    document.getElementById('analytics-page')?.addEventListener('change', (e) => loadAnalytics(e.target.value));

    // ---------- Settings ----------
    async function loadSettings() {
        const res = await apiCall('/api/settings');
        document.getElementById('fb-app-id').value = res.fb_app_id || '';
        document.getElementById('fb-app-secret').value = res.fb_app_secret || '';
        document.getElementById('groq-key').value = res.groq_api_key || '';
        document.getElementById('telegram-token').value = res.telegram_bot_token || '';
        document.getElementById('telegram-chat').value = res.telegram_chat_id || '';
        const status = await apiCall('/api/user-profile').catch(() => ({ error: 'Not connected' }));
        document.getElementById('fb-connection-status').innerHTML = status.error ? '❌ Not connected' : '✅ Connected as ' + (status.name || '');
    }
    document.getElementById('save-settings')?.addEventListener('click', async () => {
        const data = {
            fb_app_id: document.getElementById('fb-app-id').value,
            fb_app_secret: document.getElementById('fb-app-secret').value,
            groq_api_key: document.getElementById('groq-key').value,
            telegram_bot_token: document.getElementById('telegram-token').value,
            telegram_chat_id: document.getElementById('telegram-chat').value
        };
        await apiCall('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        alert('Settings saved');
    });
    document.getElementById('connect-fb-btn')?.addEventListener('click', () => {
        const appId = document.getElementById('fb-app-id').value;
        if (!appId) return alert('Enter Facebook App ID first');
        const redirectUri = encodeURIComponent(window.location.origin);
        const scope = 'pages_manage_posts,pages_read_engagement,pages_read_user_content,publish_video';
        const authUrl = `https://www.facebook.com/v25.0/dialog/oauth?client_id=${appId}&redirect_uri=${redirectUri}&scope=${scope}&response_type=token`;
        window.open(authUrl, 'fbAuth', 'width=700,height=500');
        window.addEventListener('message', async (e) => {
            if (e.data && e.data.accessToken) {
                const res = await apiCall('/api/connect-facebook', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ short_lived_token: e.data.accessToken }) });
                if (res.success) {
                    await loadUser();
                    await loadSettings();
                } else alert(res.error);
            }
        });
    });
    document.getElementById('disconnect-fb-btn')?.addEventListener('click', async () => {
        await apiCall('/api/disconnect-facebook', { method: 'POST' });
        await loadUser();
        await loadSettings();
    });

    // ---------- Navigation ----------
    document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', (e) => {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`${link.dataset.section}-section`).classList.remove('hidden');
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            if (link.dataset.section === 'analytics' && pages.length) loadAnalytics(pages[0].id);
            if (link.dataset.section === 'library') loadMedia();
            if (link.dataset.section === 'posts') loadScheduled();
            if (link.dataset.section === 'scheduler') { loadMedia(); loadScheduled(); }
        });
    });

    document.querySelectorAll('.filter-posts-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-posts-btn').forEach(b => b.classList.remove('active', 'bg-blue-600', 'text-white'));
            btn.classList.add('active', 'bg-blue-600', 'text-white');
            renderPostsList(btn.dataset.status);
        });
    });

    // Initial load
    loadUser();
    loadSettings();
    if (window.location.hash) {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        if (accessToken) {
            window.opener?.postMessage({ accessToken }, '*');
            window.close();
        }
    }
</script>
</body>
</html>
