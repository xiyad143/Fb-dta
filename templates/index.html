<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XIYAD FACEBOOK Media Pro | Creator Studio</title>
    <!-- Font Awesome 6, Chart.js, GSAP for light animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f2f5 0%, #e4e9f2 100%);
            transition: background 0.3s ease, color 0.2s;
            padding: 1.5rem;
        }

        body.dark {
            background: #0a0c10;
            color: #e4e6eb;
        }

        /* Glassmorphism cards with soft shadows */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
        }
        body.dark .glass-card {
            background: rgba(30, 36, 48, 0.7);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Premium buttons */
        .btn-primary {
            background: linear-gradient(105deg, #1877f2, #0e5fd9);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 44px;
            padding: 0.65rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(24, 119, 242, 0.3);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #1b7ef5, #0c54c4);
            box-shadow: 0 6px 14px rgba(24, 119, 242, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #1877f2;
            color: #1877f2;
            border-radius: 44px;
            padding: 0.6rem 1.4rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-outline:hover {
            background: rgba(24, 119, 242, 0.1);
        }

        /* Inputs */
        .input-modern {
            background: white;
            border: 1px solid #dddfe2;
            border-radius: 44px;
            padding: 0.8rem 1.2rem;
            width: 100%;
            font-size: 0.9rem;
            transition: 0.2s;
            outline: none;
        }
        .input-modern:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);
        }
        body.dark .input-modern {
            background: #1e293b;
            border-color: #3a3f48;
            color: white;
        }

        /* Media cards */
        .media-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        body.dark .media-card {
            background: #242a35;
            border-color: #2d3543;
        }
        .media-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-item {
            animation: fadeSlideUp 0.35s ease forwards;
        }

        .toast-message {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e1e2f;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            z-index: 9999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .loader {
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top: 3px solid #1877f2;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .badge {
            background: #1877f210;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* Page item hover */
        .page-item {
            cursor: pointer;
            transition: 0.15s;
            border-left: 3px solid transparent;
        }
        .page-item.active {
            border-left-color: #1877f2;
            background: rgba(24,119,242,0.08);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e4e6eb; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #bcc0c8; border-radius: 10px; }
    </style>
</head>
<body>
<div class="max-w-7xl mx-auto">
    <!-- Header with brand & theme -->
    <div class="flex-between mb-7">
        <div class="flex items-center gap-3">
            <i class="fab fa-facebook text-5xl text-[#1877f2] drop-shadow-md"></i>
            <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-[#1877f2] to-[#6d8fbb] bg-clip-text text-transparent">XIYAD<span class="text-gray-800 dark:text-white"> Media Pro</span></h1>
        </div>
        <div class="flex gap-3">
            <button id="themeToggle" class="glass-card w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-moon text-[#1877f2]"></i></button>
            <button id="resetAll" class="btn-primary !bg-red-500/90 !shadow-none"><i class="fas fa-trash-alt"></i> Reset</button>
        </div>
    </div>

    <!-- App credentials & OAuth -->
    <div class="glass-card p-6 mb-6">
        <div class="flex-between"><h2 class="text-xl font-semibold"><i class="fab fa-facebook-square text-[#1877f2]"></i> App Settings</h2></div>
        <div class="grid md:grid-cols-2 gap-4 mt-3">
            <input id="appId" class="input-modern" placeholder="Facebook App ID *">
            <input id="appSecret" type="password" class="input-modern" placeholder="App Secret (local only)">
        </div>
        <div class="flex gap-3 mt-4">
            <button id="saveSettings" class="btn-primary"><i class="fas fa-save"></i> Save</button>
            <button id="connectOAuth" class="btn-primary !bg-gradient-to-r from-[#1877f2] to-[#0b5ed7]"><i class="fab fa-facebook"></i> Connect Facebook</button>
        </div>
        <div id="oauthMsg" class="text-xs mt-2 text-gray-500"></div>
    </div>

    <!-- Token Vault & Profile -->
    <div class="glass-card p-6 mb-6">
        <div class="flex-between"><h2 class="text-xl font-semibold"><i class="fas fa-key"></i> Token Manager</h2><button id="multiAccountBtn" class="btn-outline text-sm"><i class="fas fa-user-plus"></i> Multi‑Account</button></div>
        <div class="grid md:grid-cols-2 gap-4 mt-3">
            <input id="userToken" class="input-modern" placeholder="User Access Token">
            <button id="verifyTokenBtn" class="btn-primary w-full">Verify Token</button>
        </div>
        <div id="tokenStatus" class="text-xs mt-2"></div>
        <div id="accountList" class="flex flex-wrap gap-2 mt-3"></div>
        <div class="flex gap-4 items-center mt-5 pt-3 border-t border-gray-200 dark:border-gray-700">
            <div id="avatar" class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden"><i class="fas fa-user-circle text-2xl text-gray-500"></i></div>
            <div><div id="displayName" class="font-bold">Not connected</div><div id="fbUserId" class="text-xs opacity-70"></div></div>
            <button id="fetchPagesBtn" class="btn-primary ml-auto"><i class="fas fa-sync-alt"></i> Load Pages</button>
        </div>
    </div>

    <!-- Pages list -->
    <div class="glass-card p-6 mb-6">
        <h2 class="text-xl font-semibold mb-3"><i class="fas fa-th-large"></i> Your Pages</h2>
        <div id="pagesList" class="flex flex-wrap gap-3 max-h-48 overflow-y-auto"></div>
        <div id="activePageName" class="text-sm text-[#1877f2] mt-2"></div>
    </div>

    <!-- Stats cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
        <div class="glass-card p-4 text-center"><i class="fas fa-video text-2xl text-[#1877f2]"></i><h3 id="totalCount" class="text-3xl font-bold mt-1">0</h3><p>Total Media</p></div>
        <div class="glass-card p-4 text-center"><i class="fas fa-chart-line text-2xl text-[#31a24c]"></i><h3 id="totalViewsCount" class="text-3xl font-bold mt-1">0</h3><p>Total Views</p></div>
        <div class="glass-card p-4 text-center"><i class="fas fa-calendar-week text-2xl text-[#f7b928]"></i><h3 id="todayUploads" class="text-3xl font-bold mt-1">0</h3><p>Uploads Today</p></div>
        <div class="glass-card p-4 text-center"><i class="fas fa-cloud-upload-alt text-2xl text-[#e34f4f]"></i><h3 id="apiCallsCount" class="text-3xl font-bold mt-1">0</h3><p>API Calls</p></div>
    </div>

    <!-- Chart + Activity -->
    <div class="grid lg:grid-cols-2 gap-6 mb-6">
        <div class="glass-card p-5"><canvas id="uploadChart" height="200"></canvas><p class="text-center text-sm mt-2">Last 7 days uploads</p></div>
        <div class="glass-card p-5"><div class="flex-between"><h3 class="font-semibold"><i class="fas fa-list-ul"></i> Activity Feed</h3><button id="clearFeed" class="text-xs text-gray-500">Clear</button></div><div id="activityFeed" class="h-52 overflow-y-auto text-sm mt-3 space-y-2"></div></div>
    </div>

    <!-- Tools row: AI caption, Bulk upload, Export -->
    <div class="glass-card p-5 mb-6 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex gap-2 items-center"><i class="fas fa-magic text-[#1877f2]"></i><span class="font-medium">AI Caption:</span><select id="captionStyle" class="rounded-full px-3 py-1 bg-white dark:bg-gray-800 border"><option value="viral">🔥 Viral</option><option value="business">💼 Business</option><option value="funny">😂 Funny</option><option value="motivation">💪 Motivation</option></select><button id="generateCaption" class="btn-primary !py-1">✨ Copy</button></div>
        <button id="openBulk" class="btn-primary"><i class="fas fa-layer-group"></i> Bulk Publisher</button>
        <button id="exportCsv" class="btn-primary !bg-emerald-600"><i class="fas fa-download"></i> Export CSV</button>
    </div>

    <!-- Search & Filter -->
    <div class="glass-card p-4 mb-6 flex flex-wrap gap-3 items-center">
        <input id="searchMedia" class="input-modern flex-1" placeholder="🔍 Search by title or description...">
        <select id="typeFilter" class="rounded-full px-4 py-2 bg-white dark:bg-gray-800"><option value="all">All content</option><option value="reel">Reels only</option><option value="video">Videos only</option></select>
        <select id="sortBy" class="rounded-full px-4 py-2"><option value="date">📅 Newest first</option><option value="views">👁️ Most viewed</option></select>
    </div>

    <!-- Media Gallery -->
    <div class="glass-card p-6">
        <div class="flex-between"><h2 class="text-xl font-semibold"><i class="fab fa-facebook"></i> Media Studio</h2><button id="loadMoreBtn" class="btn-outline text-sm hidden">Load more ⟳</button></div>
        <div id="mediaGallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-5 max-h-[580px] overflow-y-auto p-1"></div>
    </div>
</div>

<!-- Bulk upload modal -->
<div id="bulkModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="glass-card w-full max-w-2xl p-6 rounded-3xl">
        <div class="flex-between"><h2 class="text-xl font-bold"><i class="fab fa-facebook"></i> Bulk Reel Upload</h2><i id="closeBulkModal" class="fas fa-times text-2xl cursor-pointer"></i></div>
        <div class="border-2 border-dashed rounded-2xl p-4 mt-3 text-center"><input type="file" id="bulkFiles" multiple accept="video/mp4, video/quicktime"></div>
        <div id="queuePreview" class="max-h-40 overflow-auto text-sm my-3"></div>
        <button id="startBulkUpload" class="btn-primary w-full">Start publishing queue</button>
        <div id="bulkStatus" class="text-sm mt-2"></div>
    </div>
</div>

<!-- Video preview modal -->
<div id="previewModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="glass-card max-w-3xl w-full p-4 rounded-2xl"><div class="flex justify-end"><i id="closePreview" class="fas fa-times text-2xl cursor-pointer"></i></div><video id="previewVideo" controls class="w-full rounded-xl" autoplay></video></div>
</div>

<script>
    // ------------------------------------------------------------
    // COMPLETE FRONTEND – ALL FEATURES INTEGRATED
    // Assumes Flask backend at same origin: /api/me, /api/pages, /api/pages/<id>/videos, /api/publish
    // ------------------------------------------------------------
    // DOM elements
    const appIdEl = document.getElementById('appId'), appSecretEl = document.getElementById('appSecret');
    const userTokenEl = document.getElementById('userToken'), verifyBtn = document.getElementById('verifyTokenBtn');
    const saveSettingsBtn = document.getElementById('saveSettings'), connectOAuthBtn = document.getElementById('connectOAuth');
    const multiAccountBtn = document.getElementById('multiAccountBtn'), fetchPagesBtn = document.getElementById('fetchPagesBtn');
    const resetAllBtn = document.getElementById('resetAll'), themeToggle = document.getElementById('themeToggle');
    const generateCaptionBtn = document.getElementById('generateCaption'), exportCsvBtn = document.getElementById('exportCsv');
    const openBulkBtn = document.getElementById('openBulk'), closeBulkModal = document.getElementById('closeBulkModal');
    const startBulkUploadBtn = document.getElementById('startBulkUpload'), bulkFilesInput = document.getElementById('bulkFiles');
    const searchInput = document.getElementById('searchMedia'), typeFilter = document.getElementById('typeFilter');
    const sortSelect = document.getElementById('sortBy'), loadMoreBtn = document.getElementById('loadMoreBtn');
    const pagesContainer = document.getElementById('pagesList'), mediaGallery = document.getElementById('mediaGallery');
    const totalCountSpan = document.getElementById('totalCount'), totalViewsSpan = document.getElementById('totalViewsCount');
    const todayUploadsSpan = document.getElementById('todayUploads'), apiCallsSpan = document.getElementById('apiCallsCount');
    const tokenStatusDiv = document.getElementById('tokenStatus'), activityFeedDiv = document.getElementById('activityFeed');
    const clearFeedBtn = document.getElementById('clearFeed'), activePageNameDiv = document.getElementById('activePageName');
    const avatarDiv = document.getElementById('avatar'), displayNameSpan = document.getElementById('displayName');
    const fbUserIdSpan = document.getElementById('fbUserId'), oauthMsgDiv = document.getElementById('oauthMsg');

    // State
    let currentPageId = null, currentPageToken = null;
    let allMedia = [], nextCursor = null;
    let chartInstance = null;
    let activityLog = [];
    let activeAccounts = JSON.parse(localStorage.getItem('xiya_accounts') || '[]');
    let apiCallCount = 0;

    // Helpers
    function showToast(msg, isErr = false) {
        const t = document.createElement('div'); t.className = 'toast-message'; t.innerHTML = `<i class="fas ${isErr ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
    }
    function addActivity(msg) { activityLog.unshift({ msg, time: new Date().toLocaleTimeString() }); if (activityLog.length > 30) activityLog.pop(); renderActivity(); }
    function renderActivity() { activityFeedDiv.innerHTML = activityLog.map(l => `<div class="border-b pb-1"><span class="text-xs opacity-50">${l.time}</span> ${l.msg}</div>`).join(''); }
    clearFeedBtn.onclick = () => { activityLog = []; renderActivity(); };

    async function apiReq(endpoint, opts = {}) {
        const token = userTokenEl.value;
        const headers = { 'Authorization': `Bearer ${token}`, ...opts.headers };
        const res = await fetch(endpoint, { ...opts, headers });
        if (!res.ok) throw new Error(await res.text());
        apiCallCount++; apiCallsSpan.innerText = apiCallCount;
        return res.json();
    }

    async function verifyToken() {
        const token = userTokenEl.value;
        if (!token) { tokenStatusDiv.innerHTML = '<span class="badge">❌ No token</span>'; return false; }
        tokenStatusDiv.innerHTML = '<span class="badge">⏳ Verifying...</span>';
        try {
            const data = await apiReq('/api/me');
            tokenStatusDiv.innerHTML = `<span class="badge text-green-600">✅ Valid (${data.name})</span>`;
            displayNameSpan.innerText = data.name; fbUserIdSpan.innerText = data.id;
            if (data.picture) avatarDiv.innerHTML = `<img src="${data.picture.data.url}" class="w-full h-full object-cover">`;
            return true;
        } catch(e) { tokenStatusDiv.innerHTML = `<span class="badge text-red-500">⚠️ Invalid token: ${e.message}</span>`; return false; }
    }
    verifyBtn.onclick = verifyToken;

    // Multi-account UI
    function renderAccounts() {
        const container = document.getElementById('accountList');
        container.innerHTML = activeAccounts.map((acc, idx) => `<div class="glass-card px-3 py-1 flex gap-2 items-center"><i class="fas fa-user-circle"></i>${acc.name}<button class="text-xs text-blue-500 switchAcc" data-token="${acc.token}">Switch</button><button class="text-xs text-red-400 removeAcc" data-idx="${idx}">x</button></div>`).join('');
        document.querySelectorAll('.switchAcc').forEach(btn => btn.addEventListener('click', () => { userTokenEl.value = btn.dataset.token; localStorage.setItem('fb_active_token', btn.dataset.token); verifyToken(); fetchPages(); showToast('Switched account'); }));
        document.querySelectorAll('.removeAcc').forEach(btn => btn.addEventListener('click', () => { activeAccounts.splice(btn.dataset.idx, 1); localStorage.setItem('xiya_accounts', JSON.stringify(activeAccounts)); renderAccounts(); }));
    }
    multiAccountBtn.onclick = () => { let name = prompt('Account name'); let token = prompt('Access token'); if (name && token) { activeAccounts.push({ name, token }); localStorage.setItem('xiya_accounts', JSON.stringify(activeAccounts)); renderAccounts(); addActivity(`Added ${name}`); } };
    renderAccounts();

    // Facebook OAuth (fixed)
    function fbOAuth() {
        const appId = appIdEl.value.trim();
        if (!appId) { oauthMsgDiv.innerText = '❌ Enter App ID first'; showToast('App ID required', true); return; }
        oauthMsgDiv.innerText = '⏳ Loading SDK...';
        const redirectUri = window.location.origin + '/';
        if (window.FB) { FB.init({ appId, version: 'v19.0' }); doLogin(); }
        else { window.fbAsyncInit = () => { FB.init({ appId, version: 'v19.0' }); doLogin(); }; if (!document.getElementById('fb-sdk')) { let js = document.createElement('script'); js.id = 'fb-sdk'; js.src = 'https://connect.facebook.net/en_US/sdk.js'; document.head.append(js); } else doLogin(); }
        function doLogin() { FB.login(resp => { if (resp.authResponse) { const token = resp.authResponse.accessToken; userTokenEl.value = token; localStorage.setItem('fb_active_token', token); verifyToken().then(() => fetchPages()); oauthMsgDiv.innerText = '✅ Connected!'; addActivity('Facebook login success'); showToast('Connected'); } else { oauthMsgDiv.innerText = '❌ Login cancelled'; showToast('Login failed', true); } }, { scope: 'pages_show_list,pages_read_engagement,pages_read_user_content,pages_manage_posts', redirect_uri: redirectUri }); }
    }
    connectOAuthBtn.onclick = fbOAuth;
    saveSettingsBtn.onclick = () => { localStorage.setItem('fb_app_id', appIdEl.value); localStorage.setItem('fb_app_secret', appSecretEl.value); showToast('Credentials saved'); addActivity('App credentials saved'); };

    // Pages and videos
    async function fetchPages() {
        const token = userTokenEl.value;
        if (!token) { showToast('No token', true); return; }
        try {
            const pagesData = await apiReq('/api/pages');
            const pages = pagesData.data || [];
            if (!pages.length) { pagesContainer.innerHTML = '<div class="text-sm">No pages found (need page admin)</div>'; return; }
            pagesContainer.innerHTML = pages.map(p => `<div class="glass-card p-2 flex gap-3 items-center cursor-pointer pageItem" data-pageid="${p.id}" data-pagetoken="${p.access_token}"><img src="${p.picture?.data?.url || 'https://graph.facebook.com/'+p.id+'/picture'}" class="w-8 h-8 rounded-full"><div><b>${p.name}</b><div class="text-xs">${p.followers_count || 0} followers</div></div></div>`).join('');
            document.querySelectorAll('.pageItem').forEach(el => { el.addEventListener('click', () => { currentPageId = el.dataset.pageid; currentPageToken = el.dataset.pagetoken; activePageNameDiv.innerText = `Active: ${el.querySelector('b')?.innerText}`; fetchVideos(true); addActivity(`Selected page: ${el.querySelector('b')?.innerText}`); }); });
        } catch(e) { showToast('Pages error', true); addActivity(`Pages error: ${e.message}`); }
    }
    fetchPagesBtn.onclick = fetchPages;

    async function fetchVideos(reset = true) {
        if (!currentPageId) { showToast('Select a page first', true); return; }
        if (reset) { allMedia = []; nextCursor = null; }
        mediaGallery.innerHTML = '<div class="col-span-full flex justify-center"><div class="loader"></div></div>';
        try {
            let url = `/api/pages/${currentPageId}/videos?limit=18`;
            if (nextCursor && !reset) url += `&after=${nextCursor}`;
            const data = await apiReq(url);
            const videos = data.data || [];
            const enriched = videos.map(v => ({ ...v, is_reel: (v.title?.toLowerCase().includes('reel') || v.length < 90 || v.permalink?.includes('/reel/')), reactions: v.reactions?.summary?.total_count || 0, comments: v.comments?.summary?.total_count || 0 }));
            allMedia = reset ? enriched : [...allMedia, ...enriched];
            nextCursor = data.paging?.cursors?.after || null;
            renderMedia();
            updateStatsAndChart();
            loadMoreBtn.classList.toggle('hidden', !nextCursor);
            addActivity(`Loaded ${enriched.length} items`);
        } catch(e) { mediaGallery.innerHTML = `<div class="col-span-full text-red-500">Error: ${e.message}</div>`; }
    }

    function renderMedia() {
        let filtered = [...allMedia];
        if (searchInput.value) filtered = filtered.filter(m => (m.title || '').toLowerCase().includes(searchInput.value.toLowerCase()) || (m.description || '').toLowerCase().includes(searchInput.value.toLowerCase()));
        if (typeFilter.value === 'reel') filtered = filtered.filter(m => m.is_reel);
        if (typeFilter.value === 'video') filtered = filtered.filter(m => !m.is_reel);
        if (sortSelect.value === 'views') filtered.sort((a,b) => (b.views||0)-(a.views||0));
        else filtered.sort((a,b) => new Date(b.created_time) - new Date(a.created_time));
        mediaGallery.innerHTML = filtered.map(m => `<div class="media-card p-3"><div class="relative"><img src="${m.thumbnail_url || 'https://via.placeholder.com/300x180?text=No+thumb'}" class="w-full h-40 object-cover rounded-xl"><span class="absolute top-2 left-2 bg-black/50 text-xs px-2 rounded-full">${m.is_reel ? '🎬 Reel' : '📹 Video'}</span><span class="absolute bottom-2 right-2 bg-black/50 text-xs px-2 rounded">👁️ ${(m.views||0).toLocaleString()}</span></div><div class="mt-2"><div class="font-semibold truncate">${m.title || 'Untitled'}</div><div class="flex justify-between text-xs mt-1"><span><i class="far fa-heart"></i> ${m.reactions||0}</span><span><i class="far fa-comment"></i> ${m.comments||0}</span><span>📅 ${new Date(m.created_time).toLocaleDateString()}</span></div><div class="flex gap-2 mt-2"><button class="text-blue-500 text-sm copy-link" data-link="${m.permalink}"><i class="fas fa-copy"></i> Copy</button><button class="text-green-500 text-sm preview-btn" data-video="${m.permalink}"><i class="fas fa-play-circle"></i> Preview</button></div></div></div>`).join('');
        document.querySelectorAll('.copy-link').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); navigator.clipboard.writeText(btn.dataset.link); showToast('Link copied'); }));
        document.querySelectorAll('.preview-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('previewVideo').src = btn.dataset.video; document.getElementById('previewModal').classList.remove('hidden'); }));
    }

    function updateStatsAndChart() {
        const total = allMedia.length, totalViewSum = allMedia.reduce((s,v)=>s+(v.views||0),0);
        const today = new Date().toISOString().slice(0,10);
        const todayCount = allMedia.filter(m=>m.created_time?.startsWith(today)).length;
        totalCountSpan.innerText = total; totalViewsSpan.innerText = totalViewSum.toLocaleString(); todayUploadsSpan.innerText = todayCount;
        const last7 = [...Array(7)].map((_,i)=>{let d=new Date(); d.setDate(d.getDate()-i); return d.toISOString().slice(0,10);}).reverse();
        const counts = last7.map(date=> allMedia.filter(v=>v.created_time?.startsWith(date)).length);
        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('uploadChart').getContext('2d');
        chartInstance = new Chart(ctx, { type: 'line', data: { labels: last7.map(d=>d.slice(5)), datasets: [{ label: 'Uploads', data: counts, borderColor: '#1877f2', backgroundColor: '#1877f210', tension: 0.3, fill: true, pointBackgroundColor: '#1877f2' }] }, options: { responsive: true, maintainAspectRatio: true } });
    }
    loadMoreBtn.onclick = () => { if (nextCursor && currentPageId) fetchVideos(false); };
    searchInput.addEventListener('input', renderMedia);
    typeFilter.addEventListener('change', renderMedia);
    sortSelect.addEventListener('change', renderMedia);

    // AI Caption
    generateCaptionBtn.onclick = () => {
        const style = document.getElementById('captionStyle').value;
        const captions = { viral: "🔥 This is exploding! Double tap & share 🔥 #viral", business: "📈 Growth hack inside. Watch till the end 💼 #business", funny: "😂 I can't stop laughing! Tag a friend 😂", motivation: "💪 You are capable of more. Keep pushing #motivation" };
        navigator.clipboard.writeText(captions[style]); showToast('Caption copied!'); addActivity('AI caption generated');
    };

    // Bulk publisher
    let bulkFiles = [];
    openBulkBtn.onclick = () => document.getElementById('bulkModal').classList.remove('hidden');
    closeBulkModal.onclick = () => document.getElementById('bulkModal').classList.add('hidden');
    bulkFilesInput.onchange = (e) => { bulkFiles = Array.from(e.target.files); document.getElementById('queuePreview').innerHTML = bulkFiles.map(f => `<div>${f.name} (${(f.size/1048576).toFixed(1)} MB)</div>`).join(''); };
    async function uploadSingle(file, idx) { const fd = new FormData(); fd.append('page_id', currentPageId); fd.append('title', `Reel ${idx+1}`); fd.append('video', file); const res = await fetch('/api/publish', { method: 'POST', headers: { 'Authorization': `Bearer ${userTokenEl.value}` }, body: fd }); return res.json(); }
    startBulkUploadBtn.onclick = async () => { if (!currentPageId) { showToast('Select a page first', true); return; } if (!bulkFiles.length) return; const statusDiv = document.getElementById('bulkStatus'); for (let i=0;i<bulkFiles.length;i++) { statusDiv.innerText = `Uploading ${i+1}/${bulkFiles.length}: ${bulkFiles[i].name}`; try { const result = await uploadSingle(bulkFiles[i], i); if (result.id) { showToast(`Published: ${result.id}`); addActivity(`Bulk published: ${result.id}`); } else throw new Error(result.error); } catch(e) { showToast(`Error: ${e.message}`, true); } await new Promise(r=>setTimeout(r,1000)); } statusDiv.innerText = 'Bulk completed!'; fetchVideos(true); };

    // Export CSV
    exportCsvBtn.onclick = () => { const rows = [['Title','Link','Views','Date','Type']]; allMedia.forEach(m => rows.push([m.title||'', m.permalink||'', m.views||'', m.created_time||'', m.is_reel?'Reel':'Video'])); const csv = rows.map(r=>r.join(',')).join('\n'); const blob = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'xiya_media.csv'; a.click(); showToast('CSV exported'); addActivity('Exported CSV'); };
    document.getElementById('closePreview').onclick = () => { document.getElementById('previewModal').classList.add('hidden'); document.getElementById('previewVideo').pause(); };
    resetAllBtn.onclick = () => { localStorage.clear(); location.reload(); };
    themeToggle.onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); };
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    // Load saved data
    appIdEl.value = localStorage.getItem('fb_app_id') || '';
    appSecretEl.value = localStorage.getItem('fb_app_secret') || '';
    userTokenEl.value = localStorage.getItem('fb_active_token') || '';
    if (userTokenEl.value) { verifyToken(); fetchPages(); }
    addActivity('🚀 XIYAD Media Pro ready');
</script>
</body>
</html>
